    <h1><b>登幽州台歌</b></h1>
    <h5><i>&nbsp;&nbsp;&nbsp;&nbsp;唐&nbsp;陈子昂</i></h5>
    <h3>前不见古人，</h3>
    <h3>后不见来着，</h3>
    <h3>念天地之悠悠，</h3>
    <h3>独怆然而涕下。</h3>
    <p>鉴赏：诗人登上幽州台，看见苍茫的景象，想起自己的遭遇，抒发怀才不遇的境遇与无人诉说的现状。</p>
